
name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:  

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "STS-Annotator" --icon=NONE --add-data "src;." --hidden-import PyQt5.sip --hidden-import pandas --hidden-import numpy src/sts_annotator.py
    
    - name: List build artifacts
      run: |
        dir dist
        dir build
    
    - name: Upload artifact (EXE)
      uses: actions/upload-artifact@v4
      with:
        name: STS-Annotator-Windows
        path: dist/STS-Annotator.exe
        if-no-files-found: error
    
    - name: Upload to release (if release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/STS-Annotator.exe
        asset_name: STS-Annotator-${{ github.ref_name }}.exe
        asset_content_type: application/octet-stream